[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pathlab-ai-data"
version = "0.1.0"
description = "Reproducible public pathology dataset preparation for PathLab Evidence Challenger"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2,<3",
    "openpyxl>=3.1,<4",
    "pillow>=10,<13",
    "tifffile==2026.7.14",
]

[project.optional-dependencies]
wsi = [
    "tiffslide>=3,<5",
]
model = [
    "joblib>=1.4,<2",
    "scikit-learn>=1.8,<1.9",
    "scipy>=1.18,<2",
    "timm>=1.0,<2",
    "torch>=2.9,<3",
    "torchvision>=0.24,<0.25",
]
adapt-model = [
    "torch>=2.9,<3",
]
adapt-export = [
    "torch>=2.9,<3",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
]
adapt-train = [
    "numpy>=2,<3",
    "pyarrow>=21,<22",
    "psutil>=7,<8",
    "torch>=2.9,<3",
    "onnx>=1.18,<2",
    "onnxruntime>=1.22,<2",
    "onnxscript>=0.5,<0.6",
]

[project.scripts]
pathlab-ai-data = "pathlab_ai_data.cli:main"
pathlab-ai-model = "pathlab_ai_model.cli:main"
pathlab-adapt = "pathlab_adapt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
