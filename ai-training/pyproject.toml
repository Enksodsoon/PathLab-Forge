[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pathlab-ai-data"
version = "0.1.0"
description = "Reproducible public pathology dataset preparation for PathLab Evidence Challenger"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
wsi = [
    "pillow>=10,<13",
    "tiffslide>=3,<5",
]

[project.scripts]
pathlab-ai-data = "pathlab_ai_data.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
