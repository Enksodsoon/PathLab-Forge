<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PathLab Evidence Mentor</title>
  <style>
    :root{color-scheme:dark;--bg:#091117;--panel:#101d26;--line:#29404d;--ink:#e8f1f3;--muted:#9cb0b8;--a:#66d4bb;--bad:#ff938a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#17313c,var(--bg) 42%);color:var(--ink);font:15px system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:28px}header,.toolbar,.grid,.job-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}.eyebrow{color:var(--a);text-transform:uppercase;letter-spacing:.12em;font-size:12px}h1{margin:.25rem 0;font-size:clamp(1.7rem,4vw,3rem)}button{background:#18313c;border:1px solid #3d6473;color:var(--ink);padding:.65rem .9rem;border-radius:8px;cursor:pointer}button:focus{outline:3px solid var(--a)}button.danger{border-color:#814c4c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:22px 0}.card,.job{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:12px;padding:16px}.metric{font-size:1.55rem;margin:.35rem 0}.muted{color:var(--muted)}.jobs{display:grid;gap:12px}.job-head{justify-content:space-between}.bar{height:8px;background:#23343d;border-radius:9px;overflow:hidden;margin:.7rem 0}.bar i{display:block;height:100%;background:var(--a)}code{font-size:.78rem;word-break:break-all}.error{color:var(--bad)}@media(max-width:520px){main{padding:18px}.toolbar button{flex:1}}
  </style>
</head>
<body><main>
  <header><div><div class="eyebrow">Offline analysis operations</div><h1>PathLab Evidence Mentor</h1><div id="health" class="muted">Authenticating…</div></div><div class="toolbar"><button id="pause">Pause new claims</button><button id="resume">Resume</button></div></header>
  <section class="grid" id="metrics" aria-live="polite"></section>
  <h2>Data acquisition</h2><section class="jobs" id="acquisitions" aria-live="polite"></section>
  <h2>Qualification campaigns</h2><section class="jobs" id="campaigns" aria-live="polite"></section>
  <h2>Jobs</h2><section class="jobs" id="jobs" aria-live="polite"></section>
</main><script>
(()=>{'use strict';let csrf='',timer=0,active=false;const cache=new Map(),etags=new Map(),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function exchange(){const code=location.hash.slice(1);history.replaceState(null,'',location.pathname);if(!code)throw Error('Open this dashboard from Forge or the PathLab launcher.');const r=await fetch('/v1/dashboard-session/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});if(!r.ok)throw Error('Dashboard link expired or was already used.');csrf=(await r.json()).csrfToken}
async function mutate(path,method='POST'){const r=await fetch(path,{method,headers:{'X-PathLab-CSRF':csrf}});if(!r.ok)throw Error('Operation was refused');await refresh()}
function metric(k,v,n=''){return `<article class="card"><div class="muted">${esc(k)}</div><div class="metric">${esc(v)}</div><div class="muted">${esc(n)}</div></article>`}
function render(s,jobs,runs){$('#health').textContent=`${s.status} · v${s.serviceVersion} · boot ${new Date(s.startedAt).toLocaleString()} · network disabled`;
 const q=s.queue,qr=s.qualification||{active:0,completed:0,targetMet:0};$('#metrics').innerHTML=metric('Queue',`${q.active} active / ${q.queued} queued`,s.acceptingJobs?'Accepting jobs':'Paused')+metric('Campaigns',`${qr.active} active / ${qr.completed} completed`,`${qr.targetMet} met every frozen gate`)+metric('Memory',`${Math.round(s.telemetry.processMemoryUsedBytes/1048576)} MiB`,`limit ${Math.round(s.telemetry.processMemoryLimitBytes/1048576)} MiB`)+metric('GPU',s.telemetry.gpu?.available?`${s.telemetry.gpu.utilizationPercent}% · ${s.telemetry.gpu.vramUsedMiB} MiB`:'Unavailable','best-effort telemetry')+metric('Disk',`${Math.round(s.telemetry.diskUsableBytes/1073741824)} GiB free`,'reserve remains protected');
 const acquisitions=s.acquisitions||[];active=jobs.some(j=>['validating','running','refining','packaging'].includes(j.state))||runs.some(r=>!r.campaignCompleted)||acquisitions.some(a=>['transferring','validating','transient_error'].includes(a.state));
 $('#acquisitions').innerHTML=acquisitions.length?acquisitions.map(a=>{const p=a.totalBytes?a.completedBytes/a.totalBytes:0;return `<article class="job"><div class="job-head"><strong>${esc(a.datasetId)}</strong><span>${esc(a.state)}</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,p*100))}%"></i></div><div>${(a.completedBytes/1073741824).toFixed(2)} / ${(a.totalBytes/1073741824).toFixed(2)} GiB</div><div class="muted">Interactive acquisition only · analysis network ${esc(a.analysisNetwork)} · updated ${new Date(a.updatedAt).toLocaleString()}</div></article>`}).join(''):'<article class="card muted">No active or completed acquisitions.</article>';
 $('#campaigns').innerHTML=runs.length?runs.map(r=>{const terminal=r.tracks.filter(t=>t.verdict).length,total=r.tracks.length,p=total?terminal/total:0;return `<article class="job"><div class="job-head"><strong>${esc(r.id)}</strong><span>${esc(r.state)} · ${terminal}/${total} terminal</span></div><div class="bar"><i style="width:${Math.round(p*100)}%"></i></div><div>${r.campaignCompleted?(r.campaignTargetMet?'Every frozen gate met':'Completed with explicit non-qualified tracks'):'Autonomous coordinator active'}</div><div class="muted">${r.tracks.map(t=>`${esc(t.id)}: ${esc(t.verdict||t.state)} (attempt ${t.attempt})`).join(' · ')}</div><code>campaign ${esc(r.manifestSha256)}</code><div class="toolbar">${!r.campaignCompleted?`<button class="danger" data-run-cancel="${esc(r.id)}">Cancel campaign</button>`:''}${r.state==='waiting_attestation'?`<button data-run-resume="${esc(r.id)}">Resume checks</button>`:''}</div></article>`}).join(''):'<article class="card muted">No qualification campaigns yet.</article>';
 $('#jobs').innerHTML=jobs.length?jobs.map(j=>`<article class="job"><div class="job-head"><strong>${esc(j.id)}</strong><span>${esc(j.lane)} · ${esc(j.state)}</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,j.progress*100))}%"></i></div><div>${esc(j.stage)} · ${j.completedUnits}/${j.totalUnits||'—'} units · ${j.etaSeconds==null?'Calculating…':esc(j.etaSeconds)+'s ETA'}</div><div class="muted">${esc(j.detail)}</div><code>request ${esc(j.requestSha256)}${j.checkpointSha256?' · checkpoint '+esc(j.checkpointSha256):''}</code><div class="toolbar">${!['completed','abstained','unsupported','failed','cancelled'].includes(j.state)?`<button class="danger" data-cancel="${esc(j.id)}">Request cancellation</button>`:''}${['failed','cancelled'].includes(j.state)?`<button data-retry="${esc(j.id)}">Retry verified inputs</button>`:''}</div></article>`).join(''):'<article class="card muted">No jobs yet.</article>';
 document.querySelectorAll('[data-run-cancel]').forEach(b=>b.onclick=()=>mutate('/v1/qualification-runs/'+encodeURIComponent(b.dataset.runCancel),'DELETE'));document.querySelectorAll('[data-run-resume]').forEach(b=>b.onclick=()=>mutate('/v1/qualification-runs/'+encodeURIComponent(b.dataset.runResume)+'/resume'));
 document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>mutate('/v1/jobs/'+encodeURIComponent(b.dataset.cancel)+'/cancel'));document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>mutate('/v1/jobs/'+encodeURIComponent(b.dataset.retry)+'/retry'))}
async function cached(path){const headers={};if(etags.has(path))headers['If-None-Match']=etags.get(path);const r=await fetch(path,{headers});if(r.status===304)return cache.get(path);if(!r.ok)throw Error('Runner status unavailable');const value=await r.json(),etag=r.headers.get('ETag');if(etag)etags.set(path,etag);cache.set(path,value);return value}
async function refresh(){clearTimeout(timer);try{const [s,j,r]=await Promise.all([cached('/v1/status'),cached('/v1/jobs?limit=50'),cached('/v1/qualification-runs?limit=20')]);render(s,j.jobs,r.runs)}catch(e){$('#health').innerHTML=`<span class="error">${esc(e.message)}</span>`}timer=setTimeout(refresh,active?2000:10000)}
$('#pause').onclick=()=>mutate('/v1/control/pause');$('#resume').onclick=()=>mutate('/v1/control/resume');exchange().then(refresh).catch(e=>{$('#health').innerHTML=`<span class="error">${esc(e.message)}</span>`})})();
  </script></body></html>
